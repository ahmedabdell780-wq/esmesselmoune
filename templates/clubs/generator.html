/* الترتيب: نقاط (مع التعديل اليدوي) ← فارق الأهداف ← الأهداف المسجلة ← ترتيب القائمة */
function standings(cat){
  const en=S.teams.filter(t=>t.cats[cat]), r=new Map(en.map((t,i)=>[t.id,{t,i,p:0,w:0,d:0,l:0,gf:0,ga:0}]));
  S.matches.filter(m=>m.cat===cat&&played(m)).forEach(m=>{
    const a=r.get(m.home),b=r.get(m.away); if(!a||!b) return;
    a.p++;b.p++;a.gf+=m.hg;a.ga+=m.ag;b.gf+=m.ag;b.ga+=m.hg;
    if(m.hg>m.ag){a.w++;b.l++}else if(m.hg<m.ag){b.w++;a.l++}else{a.d++;b.d++}});
  const rows=[...r.values()].map(x=>({...x,pts:x.w*3+x.d+(S.adj[cat+"|"+x.t.id]||0),gd:x.gf-x.ga}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.i-b.i);
  return {rows,out:S.teams.filter(t=>!t.cats[cat])};
}

function renderStandings(el,cat){
  const {rows,out}=standings(cat),N=rows.length,rel=N>6?3:0,C=LEAGUE.cols;
  const body=rows.map((r,i)=>{const n=i+1,c=(n<=3?"r"+n:"")+(rel&&n>N-rel?" rel":"");
    return `<div class="gr row ${c}"><div class="rk">${n}</div><div class="tm">${lg(r.t)}<span>${esc(r.t.name)}</span></div>
      <div>${r.p}</div><div>${r.w}</div><div>${r.d}</div><div>${r.l}</div><div>${r.pts}</div></div>`}).join("")
  + out.map(t=>`<div class="gr row out"><div class="rk">-</div><div class="tm">${lg(t)}<span>${esc(t.name)}</span></div><div class="ne">${esc(LEAGUE.outLabel)}</div></div>`).join("");
  const H=408+(N+out.length)*80+(foot()?112:50);
  el.innerHTML=`<section class="lnfa std" style="aspect-ratio:1440/${H};${cvars()}" aria-label="${esc(LEAGUE.t1)}"><div class="cv">
    ${badge()}${org()}<div class="seas">${LEAGUE.s1}<br>${LEAGUE.s2}</div>
    <div class="ttl">${esc(LEAGUE.t1)}</div><div class="sub">${sub(cat)}</div>
    <div class="tbl"><div class="gr th">${C.map(c=>`<span>${esc(c)}</span>`).join("")}</div>${body}</div>
    ${foot()}</div></section>`;
}

function renderRound(el,cat,n){
  const ms=S.matches.filter(m=>m.cat===cat&&m.round===n&&T(m.home)&&T(m.away));
  const cr=(t,c)=>`<div class="cr ${c}">${t.logo?`<img src="${esc(t.logo)}" alt="">`:`<span style="font-size:calc(var(--u)*${t.code.length>3?16:t.code.length>2?19:24})">${esc(t.code)}</span>`}</div>`;
  const items=ms.map(m=>{const h=T(m.home),a=T(m.away),ok=played(m);
    const mid=ok?`<div class="sc">${m.ag}-${m.hg}</div>`:`<div class="sc p"><span><small>${esc(m.date||"")}</small>${esc(m.time||"")}</span></div>`;
    return `<li class="mt" style="list-style:none"><div class="band"></div><div class="tab">${ok?"":esc(m.venue||"")}</div>
      <div class="nm h">${esc(h.name)}</div>${mid}<div class="nm a2">${esc(a.name)}</div>${cr(h,"h")}${cr(a,"a2")}</li>`}).join("");
  const H=352+Math.max(ms.length,3)*112+(foot()?102:50);
  el.innerHTML=`<section class="lnfa res" style="aspect-ratio:1080/${H};${cvars()}" aria-label="${esc(LEAGUE.t2)}"><div class="cv">
    ${badge()}${org()}<div class="seas">${LEAGUE.s2}/${LEAGUE.s1}<small>${sub(cat)}</small></div>
    <div class="no">${n}</div><div class="ttl">${esc(LEAGUE.t2)}</div>
    ${ms.length?`<ul class="list" style="margin:0;padding:0">${items}</ul>`:`<div class="empty">لا توجد مباريات مسجلة لهذه الجولة</div>`}${foot()}</div></section>`;
}

/* ================= لوحة التحكم ================= */
const P=document.getElementById("panel");
const opt=(v,l,sel)=>`<option value="${v}" ${sel?"selected":""}>${esc(l)}</option>`;
const th=t=>t?(t.logo?`<img class="pl" src="${esc(t.logo)}" alt="">`:`<span class="pl">${esc(t.code.slice(0,3))}</span>`):"";
const inp=(a,v,x="")=>`<input ${a} value="${esc(v??"")}" ${x}>`;
function panel(){
  const cat=S.cat, en=S.teams.filter(t=>t.cats[cat]);
  const op=P.querySelectorAll?[...P.querySelectorAll("details")].map(d=>d.open):[];
  const rounds=[...new Set([S.round,...S.matches.filter(m=>m.cat===cat).map(m=>m.round)])].sort((a,b)=>a-b);
  const tsel=(id,extra="",cur)=>`<select ${id?`id="${id}"`:""} ${extra}>${(id?en:S.teams).map(t=>opt(t.id,t.name,t.id===cur)).join("")}</select>`;
  const cur=S.matches.filter(m=>m.cat===cat&&m.round===S.round);
  const L=LEAGUE;
  P.innerHTML=`
  <div class="pr"><label>الفئة <select id="cat">${CATS.map(c=>opt(c,c,c===cat)).join("")}</select></label>
   <label>الجولة <select id="rnd">${rounds.map(r=>opt(r,"الجولة "+r,r===S.round)).join("")}</select></label>
   <button data-a="newround">+ جولة جديدة</button></div>

  <details><summary>الفرق (${S.teams.length}) - تعديل الاسم والرمز والشعار والانخراط</summary>
   <div class="tw"><table class="tt"><tr><th>الفريق</th><th>الرمز</th><th>الشعار</th>${CATS.map(c=>`<th>${c}</th>`).join("")}<th>تعديل نقاط ${cat}</th><th></th></tr>
   ${S.teams.map(t=>`<tr><td><div class="nm-c">${th(t)}${inp(`data-tf="name" data-id="${t.id}"`,t.name)}</div></td><td>${inp(`data-tf="code" data-id="${t.id}" dir="ltr"`,t.code)}</td>
     <td><input type="file" accept="image/*" data-logo="${t.id}">${t.logo?`<button class="x" data-a="clrlogo" data-id="${t.id}" title="مسح الشعار">⌫</button>`:""}</td>
     ${CATS.map(c=>`<td><input type="checkbox" data-en="${t.id}|${c}" ${t.cats[c]?"checked":""}></td>`).join("")}
     <td>${inp(`type="number" data-adj="${t.id}"`,S.adj[cat+"|"+t.id]||0)}</td>
     <td><button class="x" data-a="delteam" data-id="${t.id}" aria-label="حذف">×</button></td></tr>`).join("")}</table></div>
   <div class="fr"><input id="tn" placeholder="اسم الفريق"><input id="tc" placeholder="الرمز (WH)" dir="ltr" size="6">
    <input id="tl" placeholder="رابط الشعار (اختياري)" dir="ltr"><input id="tf" type="file" accept="image/*" title="رفع شعار"><button data-a="addteam">إضافة فريق</button></div>
   <p class="hint">إلغاء تحديد فريق في فئة يعرض «${esc(L.outLabel)}» في ترتيبها. «تعديل النقاط» يضيف أو يخصم نقاطاً (مثل -3 عقوبة).</p></details>

  <details><summary>المباريات - ${cat} الجولة ${S.round} (${cur.length})</summary>
   ${cur.map(m=>`<div class="me">${th(T(m.home))}${tsel("",`data-mf="home" data-id="${m.id}"`,m.home)}<span>ضد</span>${th(T(m.away))}${tsel("",`data-mf="away" data-id="${m.id}"`,m.away)}
     ${inp(`type="number" min="0" data-mf="hg" data-id="${m.id}" placeholder="الأول"`,m.hg)}${inp(`type="number" min="0" data-mf="ag" data-id="${m.id}" placeholder="الثاني"`,m.ag)}
     ${inp(`data-mf="date" data-id="${m.id}" placeholder="التاريخ"`,m.date)}${inp(`data-mf="time" data-id="${m.id}" placeholder="16H00" dir="ltr" size="6"`,m.time)}
     ${inp(`data-mf="venue" data-id="${m.id}" placeholder="الملعب"`,m.venue)}${inp(`type="number" min="1" data-mf="round" data-id="${m.id}" title="رقم الجولة"`,m.round)}
     <button class="x" data-a="delmatch" data-id="${m.id}">×</button></div>`).join("")||`<p class="hint">لا توجد مباريات في هذه الجولة.</p>`}
   <h4>إضافة مباراة</h4>
   <div class="fr"><span id="ph">${th(en[0])}</span>${tsel("mh","",en[0]&&en[0].id)}<span>ضد</span><span id="pa">${th(en[1]||en[0])}</span>${tsel("ma","",(en[1]||en[0]||{}).id)}<input id="mhg" type="number" min="0" placeholder="أهداف الأول"><input id="mag" type="number" min="0" placeholder="أهداف الثاني"></div>
   <div class="fr"><input id="md" placeholder="التاريخ (إن لم تُلعب)"><input id="mt" placeholder="16H00" dir="ltr" size="6"><input id="mv" placeholder="الملعب"><button data-a="addmatch">إضافة المباراة</button></div>
   <p class="hint">الفريق الأول يظهر على اليمين. اترك الأهداف فارغة للمباراة غير الملعوبة.</p></details>

  <details><summary>إعدادات الرابطة والنصوص والألوان</summary>
   <div class="fg">
    ${[["name","اسم الرابطة"],["en","الاسم بالإنجليزية"],["division","الجهة / القسم"],["s1","الموسم (السنة الأولى)"],["s2","الموسم (السنة الثانية)"],
       ["t1","عنوان الترتيب"],["t2","عنوان النتائج"],["outLabel","عبارة غير المنخرط"],["site","الموقع (يظهر في التذييل)"],["fb","صفحة فيسبوك (التذييل)"]]
      .map(([k,l])=>`<label>${l}${inp(`data-l="${k}"`,L[k])}</label>`).join("")}
    <label>رابط الشعار${inp(`data-l="badgeImg" dir="ltr"`,(L.badgeImg||"").startsWith("data:")?"":L.badgeImg)}</label>
    <label>رفع شعار الرابطة<input type="file" accept="image/*" data-badge="1"></label></div>
   <div class="fg">${L.cols.map((c,i)=>`<label>عمود ${i+1}${inp(`data-lc="${i}"`,c)}</label>`).join("")}</div>
   <div class="fr">${[["g","الأخضر الأساسي"],["gb","الأخضر الفاتح (2 و3)"],["navy","الأول"],["red","الأخيرة"]]
     .map(([k,l])=>`<label>${l} <input type="color" data-c="${k}" value="${S.colors[k]}"></label>`).join("")}</div></details>
  <button class="rs" data-a="reset">إعادة ضبط البيانات</button>`;
  if(P.querySelectorAll) P.querySelectorAll("details").forEach((d,i)=>{ d.open = op.length?!!op[i]:i===0; });
}
const cards=()=>{ save(); renderStandings(document.getElementById("standings"),S.cat); renderRound(document.getElementById("round"),S.cat,S.round); };
const all=()=>{ panel(); cards(); };
const v=id=>document.getElementById(id).value.trim();
function readLogo(f,cb,sz=200){ if(!f) return; const im=new Image();
  im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=sz;const x=c.getContext("2d"),k=Math.min(sz/im.width,sz/im.height);
    x.drawImage(im,(sz-im.width*k)/2,(sz-im.height*k)/2,im.width*k,im.height*k);cb(c.toDataURL("image/webp",.85));URL.revokeObjectURL(im.src)};
  im.src=URL.createObjectURL(f); }

P.addEventListener("change",e=>{const el=e.target,d=el.dataset;
  if(el.id==="cat"){ S.cat=el.value; const r=S.matches.filter(m=>m.cat===S.cat).map(m=>m.round); S.round=r.length?Math.max(...r):1; all(); }
  else if(el.id==="rnd"){ S.round=+el.value; all(); }
  else if(el.id==="mh"||el.id==="ma"){ document.getElementById(el.id==="mh"?"ph":"pa").innerHTML=th(T(+el.value)); }
  else if(d.en){ const [id,c]=d.en.split("|"); T(+id).cats[c]=el.checked?1:0; all(); }
  else if(d.tf){ T(+d.id)[d.tf]=d.tf==="code"?el.value.trim().toUpperCase():el.value.trim(); all(); }
  else if(d.adj){ S.adj[S.cat+"|"+d.adj]=+el.value||0; cards(); }
  else if(d.logo){ readLogo(el.files[0],u=>{T(+d.logo).logo=u;all()}); }
  else if(d.mf){ const m=S.matches.find(x=>x.id===+d.id),f=d.mf;
    if(f==="hg"||f==="ag") m[f]=el.value===""?null:+el.value;
    else if(f==="home"||f==="away"||f==="round") m[f]=+el.value||1; else m[f]=el.value.trim();
    if(f==="round") S.round=m.round; all(); }
  else if(d.l){ LEAGUE[d.l]=(d.l==="s1"||d.l==="s2")?(+el.value||LEAGUE[d.l]):el.value; cards(); }
  else if(d.lc!=null){ LEAGUE.cols[+d.lc]=el.value; cards(); }
  else if(d.c){ S.colors[d.c]=el.value; cards(); }
  else if(d.badge){ readLogo(el.files[0],u=>{LEAGUE.badgeImg=u;cards()},360); }
});
P.addEventListener("click",e=>{const b=e.target.closest("[data-a]"); if(!b) return; const a=b.dataset.a;
  if(a==="addteam"){ const name=v("tn"); if(!name) return; const f=document.getElementById("tf").files[0];
    const add=lo=>{ S.teams.push({id:Date.now(),name,code:(v("tc")||name.slice(0,2)).toUpperCase(),logo:lo||v("tl"),cats:{U15:1,U17:1,U20:1}}); all(); };
    if(f) readLogo(f,add); else add(""); return; }
  else if(a==="clrlogo"){ T(+b.dataset.id).logo=""; }
  else if(a==="delteam"){ if(!confirm("حذف الفريق وكل مبارياته؟")) return; const id=+b.dataset.id;
    S.teams=S.teams.filter(t=>t.id!==id); S.matches=S.matches.filter(m=>m.home!==id&&m.away!==id); }
  else if(a==="newround"){ const r=S.matches.filter(m=>m.cat===S.cat).map(m=>m.round); S.round=Math.max(S.round,...r,0)+1; }
  else if(a==="addmatch"){ const h=+v("mh"),w=+v("ma"); if(!h||!w||h===w){ alert("اختر فريقين مختلفين"); return; }
    const hg=v("mhg"),ag=v("mag"),ok=hg!==""&&ag!=="";
    S.matches.push({id:Date.now(),cat:S.cat,round:S.round,home:h,away:w,hg:ok?+hg:null,ag:ok?+ag:null,date:v("md"),time:v("mt"),venue:v("mv")}); }
  else if(a==="delmatch"){ S.matches=S.matches.filter(m=>m.id!==+b.dataset.id); }
  else if(a==="reset"){ if(!confirm("مسح كل البيانات والعودة للقائمة الأصلية؟")) return; S=clone(SEED); LEAGUE=S.league; }
  all();
});
all();
</script>
{% endblock %}
