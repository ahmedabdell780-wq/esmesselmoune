{% extends 'base.html' %}
{% load i18n static %}
{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mb-12">
    <a href="{% url 'clubs:news_list' %}" class="btn btn-ghost btn-sm text-gray-400 hover:text-white mb-6">
        <i class="fa-solid fa-arrow-right mr-1"></i> العودة للأخبار
    </a>
    
    <div class="card rounded-3xl overflow-hidden border border-white/10" style="background:var(--card2)">
        {% if news.image %}
        <div class="w-full max-h-[500px] overflow-hidden">
            <img src="{{ news.image.url }}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='/static/img/app_logo.png';">
        </div>
        {% endif %}
        
        <div class="p-8 md:p-12">
            <p class="text-sm text-emerald-400 font-bold mb-4">{{ news.created_at|date:"d M Y" }}</p>
            <h1 class="text-3xl md:text-5xl font-black text-white mb-8">{{ news.title }}</h1>
            
            <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed font-cairo">
                {{ news.content|linebreaks }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
