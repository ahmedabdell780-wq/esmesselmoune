{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block title %}إرسال إشعار{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-4 sm:p-6 lg:p-8 animate-fade-in" dir="rtl">
    <div class="card p-8">
        <h1 class="text-2xl font-bold text-white mb-6 border-b border-white/10 pb-4">
            <i class="fa-solid fa-paper-plane text-emerald-500 mr-2"></i> إرسال إشعار جديد
        </h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-6 flex justify-end">
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-paper-plane ml-2"></i> إرسال
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
